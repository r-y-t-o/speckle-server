# docker-compose.coolify.yml
#
# Production/staging compose for Coolify deploy of a Speckle fork.
# Commit this file to the ROOT of your fork (yourname/speckle-server).
# Coolify points at this file, NOT the repo's dev-oriented compose files.
#
# Design notes:
#   - No host port bindings on application services. Coolify's Traefik proxy
#     owns ports 80/443 on the host and routes public traffic to the
#     `speckle-ingress` service's internal port 8080.
#   - All secrets and public URLs are parameterised via `${VAR:?}` so missing
#     values fail fast at deploy time and Coolify's env UI surfaces them.
#   - No default credentials anywhere. Use Coolify's "Generate" button for
#     every secret.
#   - Cross-reference required env vars with the canonical list at:
#     https://docs.speckle.systems/developers/server/deployment-options
#     If Speckle adds or renames a variable upstream, update this file in
#     your fork and redeploy.
#
# Coolify wiring:
#   - Set the public domain (e.g. https://speckle.yourname.com) on the
#     `speckle-ingress` service. Do NOT set it on `speckle-frontend-2`.
#   - Set internal port = 8080 on the ingress service so Traefik can connect.

name: speckle-server

services:

  # ─── Dependencies ────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Speckle application layer ───────────────────────────────────────

  # Public domain points HERE in Coolify. Internal port 8080.
  # No host port binding — Coolify's Traefik handles 80/443.
  speckle-ingress:
    image: speckle/speckle-docker-compose-ingress:2.31.3
    restart: always
    expose:
      - "8080"
    depends_on:
      - speckle-frontend-2
      - speckle-server

  speckle-frontend-2:
    image: speckle/speckle-frontend-2:latest
    restart: always
    environment:
      NUXT_PUBLIC_SERVER_NAME: ${SERVER_NAME:-My Speckle Server}
      NUXT_PUBLIC_API_ORIGIN: ${CANONICAL_URL:?}
      NUXT_PUBLIC_BACKEND_API_ORIGIN: http://speckle-server:3000
      NUXT_PUBLIC_BASE_URL: ${CANONICAL_URL:?}
      NUXT_REDIS_URL: redis://redis
      NUXT_PUBLIC_SSL_ENABLED: "true"
    depends_on:
      - speckle-server

  speckle-server:
    image: speckle/speckle-server:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CANONICAL_URL:    ${CANONICAL_URL:?}
      SESSION_SECRET:   ${SESSION_SECRET:?}
      STRATEGY_LOCAL:   "true"
      LOG_LEVEL:        info

      # Database
      POSTGRES_URL:          postgres
      POSTGRES_USER:         ${POSTGRES_USER:?}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD:?}
      POSTGRES_DB:           ${POSTGRES_DB:?}
      PG_CONNECTION_STRING:  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}

      # Redis
      REDIS_URL: redis://redis

      # S3 / MinIO
      S3_ENDPOINT:        http://minio:9000
      S3_PUBLIC_ENDPOINT: ${CANONICAL_URL:?}
      S3_ACCESS_KEY:      ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY:      ${S3_SECRET_KEY:?}
      S3_BUCKET:          ${S3_BUCKET:-speckle-server}
      S3_CREATE_BUCKET:   "true"

      FRONTEND_ORIGIN:    ${CANONICAL_URL:?}
      FILE_SIZE_LIMIT_MB: ${FILE_SIZE_LIMIT_MB:-100}

      # Email (SMTP — e.g. Resend on port 587 with STARTTLS)
      EMAIL:              ${EMAIL:-false}
      EMAIL_HOST:         ${EMAIL_HOST:-}
      EMAIL_PORT:         ${EMAIL_PORT:-587}
      EMAIL_USERNAME:     ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD:     ${EMAIL_PASSWORD:-}
      EMAIL_FROM:         ${EMAIL_FROM:-}
      EMAIL_SECURE:       ${EMAIL_SECURE:-false}
      EMAIL_REQUIRE_TLS:  ${EMAIL_REQUIRE_TLS:-true}

      # Registration policy. Flip to "true" once you've created your accounts
      # to prevent random sign-ups if the URL is shared/leaked.
      INVITE_ONLY: ${INVITE_ONLY:-false}

  preview-service:
    image: speckle/speckle-preview-service:latest
    restart: always
    depends_on:
      - speckle-server
    environment:
      REDIS_URL:            redis://redis
      PG_CONNECTION_STRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}

  webhook-service:
    image: speckle/speckle-webhook-service:latest
    restart: always
    depends_on:
      - speckle-server
    environment:
      PG_CONNECTION_STRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}

  fileimport-service:
    image: speckle/speckle-fileimport-service:latest
    restart: always
    depends_on:
      - speckle-server
    environment:
      SPECKLE_SERVER_URL:           http://speckle-server:3000
      PG_CONNECTION_STRING:         postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      FILEIMPORT_QUEUE_POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      S3_ENDPOINT:                  http://minio:9000
      S3_ACCESS_KEY:                ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY:                ${S3_SECRET_KEY:?}
      S3_BUCKET:                    ${S3_BUCKET:-speckle-server}

volumes:
  postgres-data:
  redis-data:
  minio-data:
